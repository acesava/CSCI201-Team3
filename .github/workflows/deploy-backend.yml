name: Deploy Java backend
on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-java-api
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Test and package
        run: ./mvnw --batch-mode verify
        working-directory: backend
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2
          role-duration-seconds: 900
      - name: Update only the team function
        run: |
          aws lambda update-function-code --function-name csci201-team3-api --zip-file fileb://backend/target/expense-api.jar --query LastUpdateStatus --output text
          aws lambda wait function-updated --function-name csci201-team3-api
      - name: Verify deployed handler
        run: |
          aws lambda invoke --function-name csci201-team3-api --cli-binary-format raw-in-base64-out --payload '{"rawPath":"/health","requestContext":{"http":{"method":"GET"}}}' /tmp/health.json > /tmp/invoke.json
          python3 - <<'PY'
          import json
          metadata = json.load(open('/tmp/invoke.json'))
          response = json.load(open('/tmp/health.json'))
          assert not metadata.get('FunctionError'), metadata
          assert response['statusCode'] == 200, response
          assert json.loads(response['body'])['status'] == 'ok', response
          print('Deployed Java health check passed')
          PY
      - name: Verify public URL and browser CORS
        run: >-
          python3 backend/scripts/check-live-api.py
          https://sautin26evkxdm33hseqsah6te0kjgua.lambda-url.us-west-2.on.aws
          https://csci201-expense-tracker.pages.dev
